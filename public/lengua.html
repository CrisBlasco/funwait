<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0066FF" />
<title data-i18n="lengua.title">Muérdete la Lengua · FunWait</title>
<link rel="icon" href="./assets/logo.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FunWait" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="./css/funwait.css" />
<style>
  :root { --lengua: #DB2777; }
  body { background: var(--lengua); }
  #home, #reglas, #opciones, #countdown, #game, #result { color: var(--fw-paper); }
  #home .fw-panel, #home .fw-tile, #reglas .fw-card, #opciones .fw-panel { color: var(--fw-night); }

  /* JUEGO */
  #game { justify-content: flex-start; gap: 10px; }
  .game-top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
  #pausaBtn { flex: none; }
  #timer { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(1.7rem, 7.5vw, 2.8rem); background: var(--fw-night); color: var(--fw-paper); padding: 2px 16px; border-radius: var(--fw-r-pill); min-width: 74px; text-align: center; }
  #timer.is-low { background: var(--fw-yellow); color: var(--fw-night); }
  #score { font-family: var(--fw-font-display); font-weight: 700; font-size: 1.3rem; min-width: 44px; text-align: right; }
  .tarjeta-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  /* Tarjeta de dos caras: A = la palabra (solo quien describe), B = las prohibidas (todo el grupo).
     Las dos caras se apilan en la misma celda: la tarjeta mide lo que la más alta. */
  .tarjeta-wrap { perspective: 1200px; }
  #carta { width: min(480px, 100%); display: grid; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,1.3,.5,1); }
  #carta.is-girada { transform: rotateY(180deg); }
  .cara {
    grid-area: 1 / 1; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    background: var(--fw-paper); color: var(--fw-night);
    border: var(--fw-border); border-radius: var(--fw-r-lg); box-shadow: var(--fw-shadow-hard);
    padding: clamp(14px, 3vh, 24px) 18px; display: flex; flex-direction: column; justify-content: center;
  }
  .cara-b { transform: rotateY(180deg); background: var(--fw-yellow); }
  .cara .et { display: block; font-size: .7rem; letter-spacing: 2px; font-weight: 700; opacity: .6; }
  #palabra { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(2rem, 10vw, 3.4rem); line-height: 1.05; margin: 2px 0 12px; overflow-wrap: anywhere; }
  #giraEn { font-weight: 700; font-size: var(--fw-fs-body); margin: 0; }
  .cara-a .fw-mute { margin: 4px 0 0; }
  #prohibidas { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #prohibidas li { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(1.3rem, 6vw, 1.8rem); }
  .jugadas.is-off { opacity: .35; pointer-events: none; }
  /* Tapa entre tarjetas: el móvil está girado hacia el grupo y la palabra nueva no debe verse */
  #tapa {
    position: absolute; inset: 0; z-index: var(--fw-z-overlay); border: 0; cursor: pointer;
    background: var(--fw-night); color: var(--fw-paper); font-family: var(--fw-font-body);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px;
  }
  #tapa .emoji { font-size: clamp(4rem, 22vw, 7rem); line-height: 1; }
  #tapa .titulo { font-family: var(--fw-font-display); font-weight: 700; font-size: var(--fw-fs-h1); }
  #tapa .txt { font-weight: 600; font-size: var(--fw-fs-body); max-width: 320px; }
  /* Tres botones grandes abajo: se juega con una mano, también andando */
  .jugadas { width: min(480px, 100%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: none; }
  .jugada {
    border: var(--fw-border); border-radius: var(--fw-r-md); box-shadow: var(--fw-shadow-hard);
    font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(.85rem, 3.8vw, 1.1rem); line-height: 1.1;
    color: var(--fw-night); background: var(--fw-paper); cursor: pointer;
    padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 76px; justify-content: center;
  }
  .jugada .ico { font-size: 1.8rem; line-height: 1; }
  .jugada:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--fw-night); }
  #acierto { background: var(--fw-green); }
  #prohibida { background: var(--fw-yellow); }
  #feedback { position: absolute; inset: 0; z-index: var(--fw-z-flash); display: flex; align-items: center; justify-content: center; font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(2.6rem, 15vw, 7rem); color: var(--fw-paper); -webkit-text-stroke: 2px var(--fw-night); opacity: 0; pointer-events: none; }
  #feedback.show { animation: fb .5s ease; }
  @keyframes fb { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.3); } }
  @media (orientation: landscape) and (max-height: 520px) {
    #game { gap: 6px; }
    #palabra { font-size: clamp(1.6rem, 9vh, 2.4rem); margin-bottom: 6px; }
    #prohibidas { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 2px 14px; padding-top: 6px; }
    #prohibidas li { font-size: 1.15rem; }
    .jugada { min-height: 0; flex-direction: row; padding: 6px; }
    .jugada .ico { font-size: 1.3rem; }
  }

  .lista { width: 100%; text-align: left; }
  .lista .item { padding: 7px 2px; font-weight: 600; border-bottom: 1px solid var(--fw-mist-2); }
  .lista .item:last-child { border-bottom: none; }
  .no-repetir input { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="fw-app">

  <!-- HOME: elegir nivel -->
  <section id="home" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar fw-topbar--title">
      <a class="fw-icon-btn fw-back" href="./index.html" data-i18n-aria-label="common.menu"></a>
      <h1 class="fw-h1" data-i18n="lengua.heading"></h1>
      <div class="fw-topbar-actions">
        <button class="fw-icon-btn" id="opcionesBtn" data-i18n-aria-label="common.options">⚙️</button>
      </div>
    </div>
    <p style="margin: 4px 0 16px; font-weight: 600; opacity: .95" data-i18n="lengua.tagline"></p>
    <div id="nivelesEstado" role="status">
      <p class="fw-mute" id="nivelesMsg"></p>
      <button class="fw-btn" id="nivelesRetry" data-i18n="common.retry" hidden></button>
    </div>
    <div class="fw-grid" id="niveles"></div>
  </section>

  <!-- OPCIONES -->
  <section id="opciones" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar fw-topbar--title"><button class="fw-icon-btn fw-back" id="opcVolver" data-i18n-aria-label="common.back"></button><h1 class="fw-h1" data-i18n="common.options.title"></h1><div class="fw-topbar-actions"></div></div>
    <div class="fw-panel" style="margin-top: 18px">
      <div class="fw-row"><span data-i18n="common.sound"></span><div class="fw-switch" id="swSonido"></div></div>
      <div class="fw-row"><span data-i18n="lengua.options.time"></span>
        <div class="fw-controls"><button class="fw-stepper" id="tMenos" data-i18n-aria-label="common.decrease">−</button><span id="tLabel" style="min-width: 64px"></span><button class="fw-stepper" id="tMas" data-i18n-aria-label="common.increase">+</button></div>
      </div>
    </div>
    <button class="fw-btn fw-btn--primary" id="opcHecho" style="margin-top: 18px" data-i18n="common.done"></button>
  </section>

  <!-- REGLAS -->
  <section id="reglas" class="fw-screen">
    <div class="fw-topbar"><button class="fw-icon-btn fw-back" id="reglasVolver" data-i18n-aria-label="common.back"></button><div class="fw-topbar-actions"></div></div>
    <div class="fw-card fw-rules">
      <div class="ilu">🗣️👅🤐</div>
      <h2 class="fw-h2" data-i18n="common.rules.title"></h2>
      <ol>
        <li><span data-i18n-html="lengua.rules.step1"></span></li>
        <li><span data-i18n-html="lengua.rules.step2"></span></li>
        <li><span data-i18n-html="lengua.rules.step3"></span></li>
      </ol>
      <p class="nota" data-i18n="lengua.rules.note"></p>
      <button class="fw-btn fw-btn--primary fw-btn--xl" id="empezar" data-i18n="common.rules.start"></button>
      <label class="no-repetir"><input type="checkbox" id="noRep" /> <span data-i18n="common.rules.noRepeat"></span></label>
    </div>
  </section>

  <!-- CUENTA ATRÁS -->
  <section id="countdown" class="fw-screen">
    <p class="fw-h2" style="margin-bottom: 10px" data-i18n-html="lengua.countdown"></p>
    <div class="fw-countdown-num" id="countNum">3</div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="fw-screen">
    <div class="game-top">
      <button class="fw-icon-btn" id="pausaBtn" data-i18n-aria-label="lengua.pause">⏸</button>
      <div id="timer">60</div>
      <div id="score">✅ 0</div>
    </div>
    <div class="tarjeta-wrap">
      <div id="carta">
        <div class="cara cara-a">
          <span class="et" data-i18n="lengua.game.say"></span>
          <div id="palabra">…</div>
          <p id="giraEn"></p>
          <p class="fw-mute" data-i18n="lengua.game.flipNow"></p>
        </div>
        <div class="cara cara-b">
          <span class="et" data-i18n="lengua.game.forbidden"></span>
          <ul id="prohibidas"></ul>
        </div>
      </div>
    </div>
    <div class="jugadas" id="jugadas">
      <button class="jugada" id="prohibida"><span class="ico">🤐</span><span data-i18n="lengua.game.taboo"></span></button>
      <button class="jugada" id="pasar"><span class="ico">⏭️</span><span data-i18n="lengua.game.pass"></span></button>
      <button class="jugada" id="acierto"><span class="ico">✅</span><span data-i18n="lengua.game.hit"></span></button>
    </div>
    <div id="feedback"></div>
    <button id="tapa" hidden><span class="emoji">🙈</span><span class="titulo" data-i18n="lengua.cover.title"></span><span class="txt" data-i18n="lengua.cover.text"></span></button>
  </section>

  <!-- PAUSA: para cuando la cola avanza -->
  <section id="pause" class="fw-screen" style="background: rgba(16,24,40,.96); color: var(--fw-paper)">
    <h2 class="fw-h1" data-i18n="lengua.pause.title"></h2>
    <button class="fw-btn fw-btn--success fw-btn--block" id="seguir" data-i18n="lengua.pause.resume"></button>
    <button class="fw-btn fw-btn--ghost fw-btn--block" id="salir" data-i18n="lengua.pause.exit"></button>
  </section>

  <!-- RESULTADO -->
  <section id="result" class="fw-screen">
    <h2 class="fw-h1" id="rTitulo"></h2>
    <div class="fw-display" id="rScore" style="color: var(--fw-yellow)">0</div>
    <p style="font-weight: 600; margin: 0 0 14px" id="rAciertos"></p>
    <div class="fw-actions">
      <button class="fw-btn fw-btn--success" id="otra" data-i18n="common.playAgain"></button>
      <a class="fw-btn fw-btn--ghost" href="./index.html" data-i18n="lengua.result.menu"></a>
    </div>
    <button class="fw-btn fw-btn--ghost fw-btn--block" id="verPalabras" style="margin-top: 8px"></button>
  </section>

</div>

<!-- Cajón de palabras -->
<div class="fw-drawer-backdrop" id="drawerBg"></div>
<div class="fw-drawer" id="drawer">
  <div class="fw-drawer-handle"></div>
  <div class="fw-drawer-head"><h2 class="fw-h2" data-i18n="lengua.words.title"></h2><button class="fw-icon-btn" id="drawerClose" data-i18n-aria-label="common.close">✕</button></div>
  <div class="fw-drawer-body"><div class="lista" id="lista"></div></div>
</div>

<script src="./js/i18n/es.js"></script>
<script src="./js/funwait.js"></script>
<script>
let config = Object.assign({ tiempo: 60 }, FW.prefs.lengua || {});
function guardarCfg() { FW.prefs.lengua = { tiempo: config.tiempo }; FW.save(); }
const VISTAZO = 5; // segundos para memorizar la palabra, con el reloj de la ronda parado
// fase: 'palabra' (cara A), 'prohibidas' (cara B, corre el reloj) o 'tapa' (entre tarjetas)
let juego = { nivel: null, tarjeta: null, aciertos: 0, resultados: [], tiempoRestante: 0, timerId: null,
  activo: false, fase: null, vistazoId: null, vistazoRestante: 0 };
const $ = id => document.getElementById(id);
const timerEl = $('timer'), scoreEl = $('score'), fbEl = $('feedback');

/* ---------- menú ---------- */
const nivelesEl = $('niveles');
function pintarNiveles(niveles) {
  nivelesEl.replaceChildren(
    FW.tile('🎲', FW.t('common.random'), null, () => empezar(niveles[Math.floor(Math.random() * niveles.length)])),
    ...niveles.map(n => FW.tile(n.emoji, n.nombre, n.color, () => empezar(n)))
  );
}
async function cargarNiveles() {
  $('nivelesEstado').hidden = false; $('nivelesMsg').textContent = FW.t('common.loading'); $('nivelesRetry').hidden = true;
  try {
    pintarNiveles((await FW.loadContent('lengua')).niveles);
    $('nivelesEstado').hidden = true;
  } catch (e) {
    $('nivelesMsg').textContent = FW.t('lengua.loadError');
    $('nivelesRetry').hidden = false;
  }
}
$('nivelesRetry').onclick = cargarNiveles;

/* ---------- ajustes ---------- */
const pintarCfg = () => { $('tLabel').textContent = FW.t('common.seconds', { n: config.tiempo }); };
pintarCfg();
$('tMas').onclick = () => { config.tiempo = Math.min(120, config.tiempo + 15); pintarCfg(); guardarCfg(); };
$('tMenos').onclick = () => { config.tiempo = Math.max(30, config.tiempo - 15); pintarCfg(); guardarCfg(); };
$('opcionesBtn').onclick = () => FW.screen('opciones');
$('opcVolver').onclick = () => FW.screen('home');
$('opcHecho').onclick = () => FW.screen('home');

FW.bindSoundToggle($('swSonido'));

/* ---------- flujo ---------- */
$('noRep').checked = FW.rulesSeen('lengua');
function empezar(nivel) {
  FW.unlock();
  juego.nivel = nivel;
  if (FW.rulesSeen('lengua')) irCuenta(); else FW.screen('reglas');
}
$('reglasVolver').onclick = () => FW.screen('home');
$('empezar').onclick = () => { if ($('noRep').checked) FW.setRulesSeen('lengua', true); irCuenta(); };

function irCuenta() { FW.wakeLock(); FW.screen('countdown'); FW.countdown($('countNum'), empezarRonda); }

function empezarRonda() {
  juego.aciertos = 0; juego.resultados = [];
  juego.tiempoRestante = config.tiempo; juego.activo = true;
  scoreEl.textContent = '✅ 0';
  pintarTimer(); siguiente();
  FW.screen('game');
}

// Cara A: quien describe memoriza la palabra. Las tarjetas no se repiten en el nivel
// hasta haberlas jugado todas, también entre rondas.
function siguiente() {
  const t = juego.tarjeta = FW.pickUnused('lengua', juego.nivel.id, juego.nivel.tarjetas, x => x.palabra);
  $('palabra').textContent = t.palabra;
  $('prohibidas').replaceChildren(...t.prohibidas.map(p => { const li = document.createElement('li'); li.textContent = p; return li; }));
  $('tapa').hidden = true;
  $('carta').classList.remove('is-girada');
  juego.fase = 'palabra';
  $('jugadas').classList.add('is-off');
  juego.vistazoRestante = VISTAZO;
  correrVistazo();
}
function pintarVistazo() { $('giraEn').textContent = FW.t('lengua.game.flipIn', { n: juego.vistazoRestante }); }
function correrVistazo() {
  clearInterval(juego.vistazoId); pintarVistazo();
  juego.vistazoId = setInterval(() => {
    juego.vistazoRestante--; pintarVistazo();
    if (juego.vistazoRestante <= 0) girar();
  }, 1000);
}
// Cara B: las prohibidas, a la vista de todos. Ahora sí corre el reloj de la ronda.
function girar() {
  if (juego.fase !== 'palabra') return;
  clearInterval(juego.vistazoId);
  juego.fase = 'prohibidas';
  $('carta').classList.add('is-girada');
  $('jugadas').classList.remove('is-off');
  FW.haptic(40);
  correrTimer();
}
$('carta').onclick = () => { if (juego.activo) girar(); };
$('tapa').onclick = () => { if (juego.activo) siguiente(); };

function pintarTimer() { timerEl.textContent = juego.tiempoRestante; timerEl.classList.toggle('is-low', juego.tiempoRestante <= 5); }
function correrTimer() {
  clearInterval(juego.timerId);
  juego.timerId = setInterval(() => {
    juego.tiempoRestante--; pintarTimer();
    if (juego.tiempoRestante <= 5 && juego.tiempoRestante > 0) FW.audio.tic();
    if (juego.tiempoRestante <= 0) finRonda();
  }, 1000);
}

// estado: 'ok' (acierto), 'pasa' o 'prohibida'. Decir una prohibida solo pasa de tarjeta.
// La siguiente palabra no sale directamente: el móvil mira al grupo, así que primero se tapa.
function registrar(estado) {
  if (!juego.activo || juego.fase !== 'prohibidas') return;
  clearInterval(juego.timerId);
  juego.resultados.push({ palabra: juego.tarjeta.palabra, estado });
  if (estado === 'ok') { juego.aciertos++; scoreEl.textContent = '✅ ' + juego.aciertos; feedback(FW.t('lengua.game.fbHit')); FW.audio.acierto(); FW.haptic(60); }
  else if (estado === 'pasa') { feedback(FW.t('lengua.game.fbPass')); FW.audio.pasar(); FW.haptic([30, 40, 30]); }
  else { feedback(FW.t('lengua.game.fbTaboo')); FW.audio.pasar(); FW.haptic([120, 60, 120]); }
  juego.fase = 'tapa';
  $('jugadas').classList.add('is-off');
  $('tapa').hidden = false;
}
function feedback(texto) { fbEl.textContent = texto; fbEl.classList.remove('show'); void fbEl.offsetWidth; fbEl.classList.add('show'); }
$('acierto').onclick = () => registrar('ok');
$('pasar').onclick = () => registrar('pasa');
$('prohibida').onclick = () => registrar('prohibida');

/* ---------- pausa: para cuando la cola avanza ---------- */
function parar() { juego.activo = false; clearInterval(juego.timerId); clearInterval(juego.vistazoId); }
$('pausaBtn').onclick = () => { if (!juego.activo) return; parar(); FW.screen('pause'); };
$('seguir').onclick = () => {
  juego.activo = true;
  if (juego.fase === 'prohibidas') correrTimer();
  else if (juego.fase === 'palabra') correrVistazo();
  FW.screen('game');
};
$('salir').onclick = () => { parar(); FW.releaseWake(); FW.screen('home'); };

/* ---------- fin ---------- */
const ICONO = { ok: '✅ ', pasa: '⏭️ ', prohibida: '🤐 ' };
function finRonda() {
  parar(); FW.audio.fin(); FW.releaseWake();
  $('rScore').textContent = juego.aciertos;
  $('rAciertos').textContent = FW.tn('lengua.result.hits', juego.aciertos);
  $('rTitulo').textContent = juego.aciertos >= 10 ? FW.t('lengua.result.great') : juego.aciertos >= 5 ? FW.t('lengua.result.good') : FW.t('lengua.result.end');
  const lista = $('lista'); lista.replaceChildren();
  const item = txt => { const d = document.createElement('div'); d.className = 'item'; d.textContent = txt; lista.appendChild(d); };
  if (!juego.resultados.length) item(FW.t('lengua.result.none'));
  juego.resultados.forEach(r => item(ICONO[r.estado] + r.palabra));
  $('verPalabras').textContent = FW.t('lengua.result.words', { n: juego.resultados.length });
  cerrarDrawer();
  FW.screen('result');
}

/* ---------- cajón de palabras ---------- */
function abrirDrawer() { $('drawer').classList.add('is-open'); $('drawerBg').classList.add('is-open'); }
function cerrarDrawer() { $('drawer').classList.remove('is-open'); $('drawerBg').classList.remove('is-open'); }
$('verPalabras').onclick = abrirDrawer;
$('drawerClose').onclick = cerrarDrawer;
$('drawerBg').onclick = cerrarDrawer;

$('otra').onclick = () => { cerrarDrawer(); irCuenta(); };

FW.screen('home');
cargarNiveles();
</script>
</body>
</html>
