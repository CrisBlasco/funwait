<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0066FF" />
<title data-i18n="bomba.title">La Bomba · FunWait</title>
<link rel="icon" href="./assets/logo.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FunWait" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="./css/funwait.css" />
<style>
  body { background: var(--fw-blue); }
  #home, #reglas, #opciones { color: var(--fw-paper); }
  #home .fw-panel, #home .fw-tile, #reglas .fw-card, #opciones .fw-panel { color: var(--fw-night); }

  /* JUEGO */
  #game { background: var(--fw-blue); }
  #temaBox {
    width: min(540px, 92%); background: var(--fw-paper); color: var(--fw-night);
    border: var(--fw-border); border-radius: var(--fw-r-md); box-shadow: var(--fw-shadow-soft);
    padding: 18px 20px; margin-bottom: 18px;
  }
  #temaBox .et { display: block; font-size: .7rem; letter-spacing: 2px; font-weight: 700; opacity: .6; }
  #temaBox .txt { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(1.4rem, 7vw, 2.2rem); line-height: 1.1; }
  #bombaWrap { position: relative; display: flex; align-items: center; justify-content: center; }
  #bomba { font-size: clamp(7rem, 42vw, 15rem); line-height: 1; will-change: transform; }
  #abandonar.is-confirm { width: auto; padding: 0 14px; font-size: 1rem; }
  .pista { position: absolute; bottom: calc(var(--fw-safe-b) + 18px); color: var(--fw-paper); font-family: var(--fw-font-display); font-weight: 600; font-size: clamp(1rem, 4.5vw, 1.3rem); opacity: .95; padding: 0 24px; }

  /* BOOM cómic */
  #boom { background: #16124a; overflow: hidden; }
  #boom::before { content: ""; position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.09) 0deg 5deg, transparent 5deg 11deg); z-index: 0; }
  #boom.is-active::before { animation: giro 14s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .estallido { position: relative; z-index: 1; width: clamp(17rem, 84vw, 30rem); height: clamp(17rem, 84vw, 30rem); display: flex; align-items: center; justify-content: center; }
  #boom.is-active .estallido { animation: estallar .45s cubic-bezier(.2,1.4,.5,1); }
  @keyframes estallar { 0% { transform: scale(.1) rotate(-15deg); opacity: 0; } 60% { transform: scale(1.18) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  .estrella { position: absolute; clip-path: polygon(50% 0%, 58% 18%, 79% 7%, 72% 30%, 95% 25%, 80% 44%, 100% 55%, 78% 60%, 88% 82%, 64% 72%, 63% 97%, 48% 78%, 34% 97%, 33% 71%, 11% 82%, 22% 59%, 0% 55%, 20% 44%, 5% 25%, 28% 30%, 21% 7%, 42% 18%); }
  .estrella-tras { inset: 0; background: radial-gradient(circle, var(--fw-yellow) 0%, var(--fw-pink) 72%); transform: rotate(9deg); }
  .estrella-med { inset: 7%; background: radial-gradient(circle, #ffe27a 0%, var(--fw-yellow) 78%); transform: rotate(-6deg); }
  .estrella-del { inset: 15%; background: radial-gradient(circle, #fff7cc 0%, #ffe27a 80%); }
  .onoma { position: relative; z-index: 2; font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(2.4rem, 14vw, 5.2rem); line-height: 1; color: var(--fw-paper); -webkit-text-stroke: 3px var(--fw-night); text-shadow: 5px 5px 0 var(--fw-night); transform: rotate(-6deg); padding: 0 8px; }
  #boom p { position: relative; z-index: 1; color: var(--fw-paper); font-weight: 700; font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 14px 0 10px; }
  #boom .acciones { position: relative; z-index: 1; }
  .no-repetir input { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="fw-app">

  <!-- HOME: elegir tema -->
  <section id="home" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar">
      <a class="fw-icon-btn fw-back" href="./index.html" data-i18n-aria-label="common.menu"></a>
      <div class="fw-topbar-actions">
        <button class="fw-icon-btn" id="opcionesBtn" data-i18n-aria-label="common.options">⚙️</button>
      </div>
    </div>
    <div style="height: 50px"></div>
    <h1 class="fw-h1" data-i18n="bomba.heading"></h1>
    <p style="margin: 4px 0 16px; font-weight: 600; opacity: .95" data-i18n="bomba.tagline"></p>
    <div id="temasEstado" role="status">
      <p class="fw-mute" id="temasMsg"></p>
      <button class="fw-btn" id="temasRetry" data-i18n="common.retry" hidden></button>
    </div>
    <div class="fw-grid" id="temas"></div>
  </section>

  <!-- OPCIONES -->
  <section id="opciones" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar"><button class="fw-icon-btn fw-back" id="opcVolver" data-i18n-aria-label="common.back"></button><div class="fw-topbar-actions"></div></div>
    <div style="height: 50px"></div>
    <h1 class="fw-h1" data-i18n="common.options.title"></h1>
    <div class="fw-panel" style="margin-top: 18px">
      <div class="fw-row"><span data-i18n="common.sound"></span><div class="fw-switch" id="swSonido"></div></div>
      <div class="fw-row"><span data-i18n="bomba.options.min"></span>
        <div class="fw-controls"><button class="fw-stepper" id="minMenos" data-i18n-aria-label="common.decrease">−</button><span id="minLabel" style="min-width: 56px"></span><button class="fw-stepper" id="minMas" data-i18n-aria-label="common.increase">+</button></div></div>
      <div class="fw-row"><span data-i18n="bomba.options.max"></span>
        <div class="fw-controls"><button class="fw-stepper" id="maxMenos" data-i18n-aria-label="common.decrease">−</button><span id="maxLabel" style="min-width: 56px"></span><button class="fw-stepper" id="maxMas" data-i18n-aria-label="common.increase">+</button></div></div>
    </div>
    <button class="fw-btn fw-btn--primary" id="opcHecho" style="margin-top: 18px" data-i18n="common.done"></button>
  </section>

  <!-- REGLAS -->
  <section id="reglas" class="fw-screen">
    <div class="fw-topbar"><button class="fw-icon-btn fw-back" id="reglasVolver" data-i18n-aria-label="common.back"></button><div class="fw-topbar-actions"></div></div>
    <div class="fw-card fw-rules">
      <div class="ilu">🙌📱💥</div>
      <h2 class="fw-h2" data-i18n="common.rules.title"></h2>
      <ol>
        <li><span data-i18n="bomba.rules.step1"></span></li>
        <li><span data-i18n="bomba.rules.step2"></span></li>
        <li><span data-i18n="bomba.rules.step3"></span></li>
      </ol>
      <p class="nota" data-i18n="bomba.rules.note"></p>
      <button class="fw-btn fw-btn--primary fw-btn--xl" id="empezar" data-i18n="common.rules.start"></button>
      <label class="no-repetir"><input type="checkbox" id="noRep" /> <span data-i18n="common.rules.noRepeat"></span></label>
    </div>
  </section>

  <!-- PRE-RONDA: qué palabras valen -->
  <section id="preRonda" class="fw-screen">
    <div class="fw-card" style="width: min(520px, 92%); text-align: center">
      <div id="prEmoji" style="font-size: clamp(3rem, 16vw, 4.5rem); line-height: 1">🎢</div>
      <h2 class="fw-h1" id="prTema" style="margin: 4px 0 0"></h2>
      <p class="fw-mute" style="margin: 12px 0 2px; letter-spacing: 1px" data-i18n="bomba.round.valid"></p>
      <p id="prDesc" style="font-weight: 600; font-size: var(--fw-fs-body); margin: 0"></p>
      <button class="fw-btn fw-btn--primary fw-btn--xl" id="prEmpezar" style="margin-top: 16px" data-i18n="bomba.round.start"></button>
      <button class="fw-btn fw-btn--block" id="prVolver" style="margin-top: 6px" data-i18n="bomba.round.back"></button>
    </div>
  </section>

  <!-- CUENTA ATRÁS -->
  <section id="countdown" class="fw-screen" style="color: var(--fw-paper)">
    <p class="fw-h2" style="margin-bottom: 10px" data-i18n-html="bomba.countdown"></p>
    <div class="fw-countdown-num" id="countNum">3</div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="fw-screen">
    <div class="fw-topbar"><button class="fw-icon-btn" id="abandonar" data-i18n-aria-label="bomba.game.quit">✕</button><div class="fw-topbar-actions"></div></div>
    <div id="temaBox"><span class="et" data-i18n="bomba.game.topic"></span><span class="txt" id="temaTxt">…</span></div>
    <div id="bombaWrap"><div id="bomba">💣</div></div>
    <div class="pista" data-i18n="bomba.game.hint"></div>
  </section>

  <!-- BOOM -->
  <section id="boom" class="fw-screen">
    <div class="estallido">
      <div class="estrella estrella-tras"></div>
      <div class="estrella estrella-med"></div>
      <div class="estrella estrella-del"></div>
      <div class="onoma" id="onoma"></div>
    </div>
    <p data-i18n="bomba.boom.loser"></p>
    <div class="acciones">
      <button class="fw-btn fw-btn--success" id="otra" data-i18n="common.playAgain"></button>
      <button class="fw-btn fw-btn--ghost" id="cambiar" data-i18n="bomba.boom.change"></button>
    </div>
  </section>

</div>
<div class="fw-flash" id="flash"></div>

<script src="./js/i18n/es.js"></script>
<script src="./js/funwait.js"></script>
<script>
let config = Object.assign({ min: 10, max: 30 }, FW.prefs.bomba || {});
function guardarCfg() { FW.prefs.bomba = { min: config.min, max: config.max }; FW.save(); }
let juego = { tema: null, activo: false, start: 0, boomId: null, tickId: null, rafId: null };
const $ = id => document.getElementById(id);
const gameEl = $('game'), bombaEl = $('bomba');

/* ---------- menú ---------- */
const temasEl = $('temas');
let onomatopeyas = [];
function pintarTemas(temas) {
  temasEl.replaceChildren(
    FW.tile('🎲', FW.t('common.random'), null, () => empezar(temas[Math.floor(Math.random() * temas.length)])),
    ...temas.map(t => FW.tile(t.emoji, t.nombre, t.color, () => empezar(t)))
  );
}
async function cargarTemas() {
  $('temasEstado').hidden = false; $('temasMsg').textContent = FW.t('common.loading'); $('temasRetry').hidden = true;
  try {
    const contenido = await FW.loadContent('bomba');
    onomatopeyas = contenido.onomatopeyas;
    pintarTemas(contenido.temas);
    $('temasEstado').hidden = true;
  } catch (e) {
    $('temasMsg').textContent = FW.t('bomba.loadError');
    $('temasRetry').hidden = false;
  }
}
$('temasRetry').onclick = cargarTemas;

/* ---------- ajustes ---------- */
const minLabel = $('minLabel'), maxLabel = $('maxLabel');
const pintar = () => { minLabel.textContent = FW.t('common.seconds', { n: config.min }); maxLabel.textContent = FW.t('common.seconds', { n: config.max }); };
$('minMas').onclick = () => { config.min = Math.min(config.max - 5, config.min + 5); pintar(); guardarCfg(); };
$('minMenos').onclick = () => { config.min = Math.max(5, config.min - 5); pintar(); guardarCfg(); };
$('maxMas').onclick = () => { config.max = Math.min(120, config.max + 5); pintar(); guardarCfg(); };
$('maxMenos').onclick = () => { config.max = Math.max(config.min + 5, config.max - 5); pintar(); guardarCfg(); };
pintar();
$('opcionesBtn').onclick = () => FW.screen('opciones');
$('opcVolver').onclick = () => FW.screen('home');
$('opcHecho').onclick = () => FW.screen('home');

FW.bindSoundToggle($('swSonido'));

/* ---------- flujo ---------- */
$('noRep').checked = FW.rulesSeen('bomba');
function empezar(tema) {
  FW.unlock();
  juego.tema = tema;
  if (FW.rulesSeen('bomba')) mostrarPreRonda(); else FW.screen('reglas');
}
$('reglasVolver').onclick = () => FW.screen('home');
$('empezar').onclick = () => { if ($('noRep').checked) FW.setRulesSeen('bomba', true); mostrarPreRonda(); };

function mostrarPreRonda() {
  const t = juego.tema;
  $('prEmoji').textContent = t.emoji;
  $('prTema').textContent = t.nombre;
  $('prDesc').textContent = t.descripcion;
  FW.screen('preRonda');
}
$('prEmpezar').onclick = irCuenta;
$('prVolver').onclick = () => FW.screen('home');

function irCuenta() { FW.wakeLock(); FW.screen('countdown'); FW.countdown($('countNum'), lanzar); }

function lanzar() {
  FW.screen('game');
  $('temaTxt').textContent = juego.tema.nombre;
  juego.activo = true; juego.start = performance.now();
  const boomMs = (config.min + Math.random() * (config.max - config.min)) * 1000;
  juego.boomId = setTimeout(explotar, boomMs);
  tic(); tension();
}

function tic() {
  if (!juego.activo) return;
  FW.audio.tic();
  const prog = Math.min(1, (performance.now() - juego.start) / 1000 / config.max);
  juego.tickId = setTimeout(tic, Math.max(120, 650 - prog * 520));
}

function lerp(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = Math.round((A >> 16) + ((B >> 16) - (A >> 16)) * t);
  const g = Math.round(((A >> 8) & 255) + (((B >> 8) & 255) - ((A >> 8) & 255)) * t);
  const bl = Math.round((A & 255) + ((B & 255) - (A & 255)) * t);
  return `rgb(${r},${g},${bl})`;
}
function tension() {
  const paso = (now) => {
    if (!juego.activo) return;
    const prog = Math.min(1, (now - juego.start) / 1000 / config.max);
    const amp = 2 + prog * 16;
    bombaEl.style.transform = `translate(${(Math.random() * 2 - 1) * amp}px, ${(Math.random() * 2 - 1) * amp}px) rotate(${(Math.random() * 2 - 1) * prog * 7}deg)`;
    gameEl.style.background = lerp('#0066FF', '#FF2A6D', prog);
    juego.rafId = requestAnimationFrame(paso);
  };
  juego.rafId = requestAnimationFrame(paso);
}

function parar() { juego.activo = false; clearTimeout(juego.boomId); clearTimeout(juego.tickId); cancelAnimationFrame(juego.rafId); }

function limpiarJuego() {
  parar(); armarAbandono(false);
  bombaEl.style.transform = ''; gameEl.style.background = '';
}

/* ---------- abandonar: dos toques, para no salir sin querer al pasar el móvil ---------- */
const abandonarBtn = $('abandonar');
let abandonoT = null;
function armarAbandono(armado) {
  clearTimeout(abandonoT); abandonoT = armado ? setTimeout(() => armarAbandono(false), 2500) : null;
  abandonarBtn.classList.toggle('is-confirm', armado);
  abandonarBtn.textContent = armado ? FW.t('bomba.game.quitConfirm') : '✕';
}
abandonarBtn.onclick = () => {
  if (!abandonoT) { armarAbandono(true); return; }
  limpiarJuego(); FW.releaseWake(); FW.screen('home');
};

function explotar() {
  limpiarJuego();
  FW.audio.boom();
  FW.haptic([400, 80, 200, 80, 300]);
  $('onoma').textContent = onomatopeyas[Math.floor(Math.random() * onomatopeyas.length)];
  FW.flash($('flash'));
  FW.releaseWake();
  FW.screen('boom');
}

$('otra').onclick = irCuenta;
$('cambiar').onclick = () => { FW.releaseWake(); FW.screen('home'); };

FW.screen('home');
cargarTemas();
</script>
</body>
</html>
