<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFC700" />
<title data-i18n="hub.title">FunWait · La cola también se juega</title>
<link rel="icon" href="./assets/logo.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FunWait" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="./css/funwait.css" />
<style>
  body { background: var(--fw-mist); }
  /* Hub: sin fila reservada para la topbar; los iconos van en la cabecera con el logo */
  /* --aire: separación que crece con la altura de la pantalla (svh donde exista) */
  #home.fw-hub { --aire: clamp(12px, 3.5vh, 36px); padding-top: calc(var(--fw-safe-t) + var(--fw-s3)); gap: var(--aire); }
  @supports (height: 1svh) { #home.fw-hub { --aire: clamp(12px, 3.5svh, 36px); } }
  .fw-hub-head {
    width: min(560px, 100%); display: grid; grid-template-columns: 44px 1fr 44px;
    align-items: center; gap: var(--fw-s2); flex: 1 0 auto;
  }
  /* La cabecera se queda el espacio sobrante: el logo se centra en él y los botones siguen arriba */
  .fw-hub-head .fw-icon-btn { align-self: start; }
  .fw-hub-head .fw-icon-btn:last-child { justify-self: end; }
  /* El logo crece más deprisa que la pantalla: pequeño en móviles bajos, protagonista en los altos */
  .fw-hero-logo { justify-self: center; height: clamp(72px, calc(45vh - 130px), 260px); height: clamp(72px, calc(45svh - 130px), 260px); max-width: 100%; }
  .fw-hero-logo svg { height: 100%; width: auto; max-width: 100%; display: block; }
  .fw-hub-random { flex: none; margin: 0 auto; }
  .fw-game-grid {
    width: min(560px, 100%); display: grid; gap: clamp(10px, calc(var(--aire) * .6), 20px);
    grid-template-columns: repeat(2, minmax(0, 1fr)); flex: none;
  }
  .fw-game-grid .fw-game-card {
    width: auto; margin: 0; padding: calc(var(--aire) * .75) var(--fw-s2);
    flex-direction: column; justify-content: center; gap: 6px; text-align: center;
    border-radius: var(--fw-r-md);
  }
  .fw-game-grid .fw-game-card .emoji { font-size: clamp(2rem, 9vw, 3rem); }
  .fw-game-grid .fw-game-card .info { flex: none; display: flex; flex-direction: column; align-items: center; }
  .fw-game-grid .fw-game-card .name { font-size: clamp(1.05rem, 4.8vw, 1.35rem); line-height: 1.1; }
  .fw-game-grid .fw-chips { justify-content: center; gap: 4px; margin-top: 6px; }
  .fw-game-grid .fw-chip { font-size: .72rem; padding: 1px 7px; white-space: nowrap; }
  .fw-game-grid .fw-game-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  /* Muy estrecho (320): una columna con tarjeta horizontal compacta */
  @media (max-width: 339px) {
    .fw-game-grid { grid-template-columns: 1fr; gap: 10px; }
    .fw-game-grid .fw-game-card { flex-direction: row; justify-content: flex-start; text-align: left; padding: 10px 14px; gap: 12px; }
    .fw-game-grid .fw-game-card .info { align-items: flex-start; }
    .fw-game-grid .fw-game-card .emoji { font-size: 2.2rem; }
    .fw-game-grid .fw-chips { justify-content: flex-start; margin-top: 4px; }
  }
  /* Apaisado bajo: logo pequeño y las 4 tarjetas en una fila */
  @media (orientation: landscape) and (max-height: 500px) {
    .fw-hero-logo { height: clamp(56px, 20vh, 96px); height: clamp(56px, 20svh, 96px); }
    .fw-game-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(760px, 100%); }
    .fw-game-grid .fw-game-card:last-child:nth-child(odd) { grid-column: auto; }
    .fw-hub-head { width: min(760px, 100%); }
    #home.fw-hub { --aire: 8px; }
    .fw-hub-random { padding-block: 8px; }
    .fw-game-grid .fw-game-card { padding: var(--fw-s2); gap: 4px; }
    .fw-game-grid .fw-game-card .emoji { font-size: 1.9rem; }
    .fw-game-grid .fw-game-card .name { font-size: 1.1rem; }
    .fw-game-grid .fw-chips { margin-top: 4px; }
  }
</style>
</head>
<body>
<div class="fw-app">

  <!-- HUB -->
  <section id="home" class="fw-screen fw-screen--scroll fw-hub">
    <header class="fw-hub-head">
      <button class="fw-icon-btn fw-help" id="help" data-i18n-aria-label="hub.help">?</button>
      <div class="fw-hero-logo"><svg id="funwait-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="45 30 425 290">
                    <defs>
                        <!-- Gradients -->
                        <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFD54F"/>
                            <stop offset="100%" stop-color="#FFC700"/>
                        </linearGradient>
                        
                        <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FF4D82"/>
                            <stop offset="100%" stop-color="#FF2A6D"/>
                        </linearGradient>

                        <!-- Drop Shadows -->
                        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#101828" flood-opacity="0.12"/>
                        </filter>
                    </defs>

                    <!-- Background Burst Subtle FX -->
                    <g opacity="0.4">
                        <line x1="200" y1="145" x2="170" y2="70" stroke="#FFC700" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
                        <line x1="200" y1="145" x2="330" y2="110" stroke="#0066FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
                        <line x1="200" y1="145" x2="260" y2="40" stroke="#FF2A6D" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
                    </g>

                    <!-- HOURGLASS (ISOTIPO) -->
                    <g class="hourglass-body" filter="url(#shadow)">
                        <!-- Hourglass Frame Outer Stroke & Glass Body -->
                        <g transform="rotate(-22 200 145)">
                            <!-- Sand Top Section -->
                            <path d="M175,100 C175,125 190,135 197,143 L203,143 C210,135 225,125 225,100 Z" fill="url(#sandGrad)"/>
                            
                            <!-- Sand Bottom Section -->
                            <path d="M178,185 C178,165 192,152 198,147 L202,147 C208,152 222,165 222,185 Z" fill="url(#sandGrad)"/>
                            
                            <!-- Falling Sand Stream -->
                            <line x1="200" y1="135" x2="200" y2="182" stroke="#FFC700" stroke-width="3" stroke-linecap="round" class="sand-stream"/>

                            <!-- Glass Contour -->
                            <path d="M170,95 C170,128 188,138 196,145 C188,152 170,162 170,195 L230,195 C230,162 212,152 204,145 C212,138 230,128 230,95 Z" fill="none" stroke="#101828" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
                            
                            <!-- Top/Bottom Caps -->
                            <rect x="162" y="87" width="76" height="12" rx="6" fill="#FF2A6D" stroke="#101828" stroke-width="5"/>
                            <rect x="162" y="191" width="76" height="12" rx="6" fill="#FF2A6D" stroke="#101828" stroke-width="5"/>
                            
                            <!-- Glass Glare Lines -->
                            <path d="M177,102 C177,112 182,120 185,124" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                            <path d="M177,185 C177,178 181,172 184,168" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                        </g>
                    </g>

                    <!-- CONFETTI & PARTICLES -->
                    <g id="confetti-group">
                        <!-- Yellow Stars -->
                        <polygon class="particle p-1" points="255,82 258,89 265,90 260,95 261,102 255,98 249,102 250,95 245,90 252,89" fill="#FFC700" stroke="#101828" stroke-width="2"/>
                        <polygon class="particle p-4" points="152,65 154,70 159,71 155,75 156,80 152,77 148,80 149,75 145,71 150,70" fill="#FFC700" stroke="#101828" stroke-width="1.8"/>

                        <!-- Blue Circles -->
                        <circle class="particle p-2" cx="325" cy="118" r="6" fill="#0066FF" stroke="#101828" stroke-width="2"/>
                        <circle class="particle p-3" cx="215" cy="55" r="4.5" fill="#0066FF" stroke="#101828" stroke-width="1.8"/>
                        
                        <!-- Magenta Pills / Confetti -->
                        <rect class="particle p-5" x="295" y="125" width="6" height="12" rx="3" transform="rotate(25 295 125)" fill="#FF2A6D" stroke="#101828" stroke-width="1.8"/>
                        <rect class="particle p-1" x="175" y="48" width="5" height="10" rx="2.5" transform="rotate(-40 175 48)" fill="#FF2A6D" stroke="#101828" stroke-width="1.5"/>
                        <rect class="particle p-3" x="240" y="40" width="6" height="11" rx="3" transform="rotate(15 240 40)" fill="#00E676" stroke="#101828" stroke-width="1.8"/>

                        <!-- Sparkles -->
                        <path class="particle p-2" d="M 285 58 Q 285 66 293 66 Q 285 66 285 74 Q 285 66 277 66 Q 285 66 285 58 Z" fill="#FFC700"/>
                        <path class="particle p-4" d="M 190 75 Q 190 80 195 80 Q 190 80 190 85 Q 190 80 185 80 Q 190 80 190 75 Z" fill="#00E676"/>
                    </g>

                    <!-- COASTER CART (LAUNCHING) -->
                    <g class="coaster-cart" filter="url(#shadow)">
                        <!-- Coaster Motion Track Trail -->
                        <path d="M210,130 Q245,100 280,80" fill="none" stroke="#101828" stroke-width="4" stroke-dasharray="3 5" opacity="0.4"/>
                        
                        <g transform="translate(255, 55) rotate(18)">
                            <!-- Cart Main Body -->
                            <path d="M0,22 L42,22 C48,22 52,17 55,10 L58,0 L6,0 L2,-10 L-10,-10 L-6,12 C-5,18 -2,22 0,22 Z" fill="url(#cartGrad)" stroke="#101828" stroke-width="5" stroke-linejoin="round"/>
                            
                            <!-- Cart Front Seat Hood Accent -->
                            <path d="M30,3 L48,3 C51,3 53,6 52,10 L50,15 L28,15 Z" fill="#FFC700" stroke="#101828" stroke-width="3"/>

                            <!-- Wheels -->
                            <circle cx="8" cy="24" r="7" fill="#F4F6F8" stroke="#101828" stroke-width="4"/>
                            <circle cx="8" cy="24" r="2" fill="#101828"/>
                            
                            <circle cx="38" cy="24" r="7" fill="#F4F6F8" stroke="#101828" stroke-width="4"/>
                            <circle cx="38" cy="24" r="2" fill="#101828"/>

                            <!-- Speed Lines Behind Cart -->
                            <line x1="-16" y1="-2" x2="-26" y2="-2" stroke="#FFC700" stroke-width="3.5" stroke-linecap="round"/>
                            <line x1="-14" y1="8" x2="-28" y2="8" stroke="#FF2A6D" stroke-width="3.5" stroke-linecap="round"/>
                            <line x1="-12" y1="18" x2="-22" y2="18" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round"/>
                        </g>
                    </g>

                    <!-- TYPOGRAPHY: FUNWAIT -->
                    <g class="brand-text" filter="url(#shadow)">
                        <!-- "Fun" in Yellow -->
                        <g class="text-fun">
                            <!-- Outer Stroke for Fun -->
                            <text x="65" y="252" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="78" fill="none" stroke="#101828" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">Fun</text>
                            <!-- Fill Fun -->
                            <text x="65" y="252" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="78" fill="#FFC700">Fun</text>
                        </g>

                        <!-- "Wait" in Blue -->
                        <g class="text-wait">
                            <!-- Outer Stroke for Wait -->
                            <text x="222" y="252" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="78" fill="none" stroke="#101828" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">Wait</text>
                            <!-- Fill Wait -->
                            <text x="222" y="252" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="78" fill="#0066FF">Wait</text>
                        </g>

                        <!-- BOMB ELEMENT ON THE 't' DOT/TOP -->
                        <g transform="translate(418, 172)" class="bomb-icon">
                            <!-- Bomb Fuse -->
                            <path d="M 10 5 Q 18 -6 24 -2" fill="none" stroke="#101828" stroke-width="3.5" stroke-linecap="round"/>
                            <!-- Spark -->
                            <path class="fuse-spark" d="M 24 -2 L 27 -7 M 24 -2 L 29 -1 M 24 -2 L 22 3 M 24 -2 L 19 -5" stroke="#FFC700" stroke-width="2.5" stroke-linecap="round"/>
                            <!-- Bomb Body -->
                            <circle cx="8" cy="18" r="11" fill="#101828"/>
                            <rect x="5" y="6" width="6" height="4" rx="1" fill="#101828"/>
                            <!-- Highlight -->
                            <circle cx="5" cy="14" r="3" fill="#FFFFFF" opacity="0.8"/>
                        </g>
                    </g>

                    <!-- SLOGAN / SUBTITLE -->
                    <g class="slogan-text">
                        <!-- Background pill for extra readability -->
                        <rect x="110" y="278" width="280" height="32" rx="16" fill="#F4F6F8"/>
                        <text x="250" y="300" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="700" font-size="17" fill="#101828" letter-spacing="0.2" data-i18n="hub.slogan"></text>
                    </g>
                </svg></div>
      <button class="fw-icon-btn" id="sound" data-i18n-aria-label="hub.sound">🔊</button>
    </header>

    <button class="fw-btn fw-btn--primary fw-btn--block fw-hub-random" id="random" data-i18n="hub.random"></button>
    <nav class="fw-game-grid" data-i18n-aria-label="hub.heading">
      <button class="fw-game-card" id="goBomba">
        <span class="emoji">💣</span>
        <span class="info">
          <span class="name" data-i18n="hub.bomba.name"></span>
          <span class="fw-chips"><span class="fw-chip" data-i18n="hub.bomba.players"></span><span class="fw-chip" data-i18n="hub.bomba.style"></span></span>
        </span>
      </button>
      <button class="fw-game-card" id="goMimica">
        <span class="emoji">🎭</span>
        <span class="info">
          <span class="name" data-i18n="hub.mimica.name"></span>
          <span class="fw-chips"><span class="fw-chip" data-i18n="hub.mimica.players"></span><span class="fw-chip" data-i18n="hub.mimica.style"></span></span>
        </span>
      </button>
      <button class="fw-game-card" id="goPortero">
        <span class="emoji">🚪</span>
        <span class="info">
          <span class="name" data-i18n="hub.portero.name"></span>
          <span class="fw-chips"><span class="fw-chip" data-i18n="hub.portero.players"></span><span class="fw-chip" data-i18n="hub.portero.style"></span></span>
        </span>
      </button>
    </nav>
  </section>

  <!-- AYUDA -->
  <section id="ayuda" class="fw-screen fw-screen--scroll" style="background: var(--fw-night); color: var(--fw-paper)">
    <div style="height: 24px"></div>
    <h2 class="fw-h1" data-i18n="hub.about.title"></h2>
    <div class="fw-card" style="color: var(--fw-night); text-align: left; width: min(520px, 92%); margin-top: 14px">
      <p data-i18n="hub.about.intro"></p>
      <p data-i18n-html="hub.about.bomba"></p>
      <p data-i18n-html="hub.about.mimica"></p>
      <p data-i18n-html="hub.about.portero"></p>
      <p id="instalarIos" data-i18n-html="hub.install.ios" hidden></p>
    </div>
    <button class="fw-btn fw-btn--primary" id="cerrarAyuda" style="margin-top: 16px" data-i18n="hub.about.close"></button>
  </section>

</div>

<script src="./js/i18n/es.js"></script>
<script src="./js/funwait.js"></script>
<script>
  const $ = id => document.getElementById(id);
  FW.screen('home');

  const soundBtn = $('sound');
  const paintSound = () => soundBtn.textContent = FW.prefs.sound ? '🔊' : '🔇';
  paintSound();
  soundBtn.onclick = () => { FW.prefs.sound = !FW.prefs.sound; FW.save(); paintSound(); if (FW.prefs.sound) FW.unlock(); };

  // iOS no ofrece instalar por su cuenta (iPadOS se identifica como Mac).
  const esIos = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalada = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  $('instalarIos').hidden = !esIos || instalada;

  $('help').onclick = () => FW.screen('ayuda');
  $('cerrarAyuda').onclick = () => FW.screen('home');
  $('goBomba').onclick = () => { FW.unlock(); location.href = './bomba.html'; };
  $('goMimica').onclick = () => { FW.unlock(); location.href = './mimica.html'; };
  $('goPortero').onclick = () => { FW.unlock(); location.href = './portero.html'; };
  $('random').onclick = () => { FW.unlock(); FW.randomGame(['./bomba.html', './mimica.html', './portero.html']); };
</script>
</body>
</html>
