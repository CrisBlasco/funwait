<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F4F6F8" />
<title data-i18n="mimica.title">Mímica Express · FunWait</title>
<link rel="icon" href="./assets/logo.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FunWait" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="./css/funwait.css" />
<style>
  body { background: var(--fw-mist); }
  #game { background: var(--fw-paper); transition: background-color .15s; flex-direction: column; justify-content: flex-start; gap: 8px; }
  .game-top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #pausaBtn { flex: none; }
  #timer { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(1.7rem, 7.5vw, 2.8rem); background: var(--fw-night); color: var(--fw-paper); padding: 2px 16px; border-radius: var(--fw-r-pill); min-width: 74px; text-align: center; }
  #score { font-family: var(--fw-font-display); font-weight: 700; font-size: 1.3rem; }
  .tema-chip { font-weight: 600; background: var(--fw-yellow); border: 2px solid var(--fw-night); border-radius: var(--fw-r-pill); padding: 3px 14px; font-size: .9rem; }
  .palabra-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
  #palabra { font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(2.6rem, 14vw, 7rem); color: var(--fw-night); padding: 0 14px; line-height: 1.05; }
  .ayuda-gestos { font-size: .8rem; font-weight: 600; opacity: .55; padding: 2px 20px; }
  #feedback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fw-font-display); font-weight: 700; font-size: clamp(3rem, 18vw, 9rem); opacity: 0; pointer-events: none; }
  #feedback.show { animation: fb .5s ease; }
  @keyframes fb { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.3); } }
  @media (orientation: landscape) and (max-height: 520px) {
    #palabra { font-size: clamp(2.8rem, 22vh, 7rem); }
    .ayuda-gestos { display: none; }
    #game { gap: 4px; }
  }
  .lista { width: 100%; text-align: left; }
  .lista .item { padding: 7px 2px; font-weight: 600; border-bottom: 1px solid var(--fw-mist-2); }
  .lista .item:last-child { border-bottom: none; }
  .no-repetir input { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="fw-app">

  <!-- HOME: elegir paquete -->
  <section id="home" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar">
      <a class="fw-icon-btn fw-back" href="./index.html" data-i18n-aria-label="common.menu"></a>
      <div class="fw-topbar-actions">
        <button class="fw-icon-btn" id="opcionesBtn" data-i18n-aria-label="common.options">⚙️</button>
      </div>
    </div>
    <h1 class="fw-h1" data-i18n="mimica.heading"></h1>
    <p class="fw-mute" style="margin: 4px 0 16px" data-i18n="mimica.tagline"></p>
    <div id="packsEstado" role="status">
      <p class="fw-mute" id="packsMsg"></p>
      <button class="fw-btn" id="packsRetry" data-i18n="common.retry" hidden></button>
    </div>
    <div class="fw-grid" id="packs"></div>
  </section>

  <!-- OPCIONES -->
  <section id="opciones" class="fw-screen fw-screen--scroll">
    <div class="fw-topbar"><button class="fw-icon-btn fw-back" id="opcVolver" data-i18n-aria-label="common.back"></button><div class="fw-topbar-actions"></div></div>
    <h1 class="fw-h1" data-i18n="common.options.title"></h1>
    <div class="fw-panel" style="margin-top: 18px">
      <div class="fw-row"><span data-i18n="common.sound"></span><div class="fw-switch" id="swSonido"></div></div>
      <div class="fw-row"><span data-i18n="mimica.options.time"></span>
        <div class="fw-controls"><button class="fw-stepper" id="tMenos" data-i18n-aria-label="common.decrease">−</button><span id="tLabel" style="min-width: 64px"></span><button class="fw-stepper" id="tMas" data-i18n-aria-label="common.increase">+</button></div>
      </div>
      <div class="fw-row"><span data-i18n="mimica.options.invert"></span><div class="fw-switch" id="swInv"></div></div>
    </div>
    <button class="fw-btn fw-btn--primary" id="opcHecho" style="margin-top: 18px" data-i18n="common.done"></button>
  </section>

  <!-- REGLAS -->
  <section id="reglas" class="fw-screen">
    <div class="fw-topbar"><button class="fw-icon-btn fw-back" id="reglasVolver" data-i18n-aria-label="common.back"></button><div class="fw-topbar-actions"></div></div>
    <div class="fw-card fw-rules">
      <div class="ilu">🙆📱🙆‍♀️</div>
      <h2 class="fw-h2" data-i18n="common.rules.title"></h2>
      <ol>
        <li><span data-i18n="mimica.rules.step1"></span></li>
        <li><span data-i18n-html="mimica.rules.step2"></span></li>
        <li><span data-i18n-html="mimica.rules.step3"></span></li>
      </ol>
      <button class="fw-btn fw-btn--primary fw-btn--xl" id="empezar" data-i18n="common.rules.start"></button>
      <label class="no-repetir"><input type="checkbox" id="noRep" /> <span data-i18n="common.rules.noRepeat"></span></label>
    </div>
  </section>

  <!-- CUENTA ATRÁS -->
  <section id="countdown" class="fw-screen" style="background: var(--fw-blue); color: var(--fw-paper)">
    <p class="fw-h2" style="margin-bottom: 10px" data-i18n="mimica.countdown"></p>
    <div class="fw-countdown-num" id="countNum">3</div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="fw-screen">
    <div class="game-top">
      <button class="fw-icon-btn" id="pausaBtn" data-i18n-aria-label="mimica.pause">⏸</button>
      <div id="timer">60</div>
      <div id="score">✅ 0</div>
    </div>
    <div class="tema-chip" id="temaChip"></div>
    <div class="palabra-wrap"><div id="palabra">…</div></div>
    <div class="ayuda-gestos" data-i18n="mimica.game.help"></div>
    <div id="feedback"></div>
  </section>

  <!-- PAUSA -->
  <section id="pause" class="fw-screen" style="background: rgba(16,24,40,.96); color: var(--fw-paper)">
    <h2 class="fw-h1" data-i18n="mimica.pause.title"></h2>
    <button class="fw-btn fw-btn--success fw-btn--block" id="seguir" data-i18n="mimica.pause.resume"></button>
    <button class="fw-btn fw-btn--ghost fw-btn--block" id="salir" data-i18n="mimica.pause.exit"></button>
  </section>

  <!-- RESULTADO -->
  <section id="result" class="fw-screen" style="background: var(--fw-blue); color: var(--fw-paper)">
    <h2 class="fw-h1" id="rTitulo"></h2>
    <div class="fw-display" id="rScore" style="color: var(--fw-yellow)">0</div>
    <p style="font-weight: 600; margin: 0 0 14px" id="rAciertos"></p>
    <div class="fw-actions">
      <button class="fw-btn fw-btn--success" id="otra" data-i18n="common.playAgain"></button>
      <a class="fw-btn fw-btn--ghost" href="./index.html" data-i18n="mimica.result.menu"></a>
    </div>
    <button class="fw-btn fw-btn--ghost fw-btn--block" id="verPalabras" style="margin-top: 8px"></button>
  </section>

</div>

<!-- Cajón de palabras -->
<div class="fw-drawer-backdrop" id="drawerBg"></div>
<div class="fw-drawer" id="drawer">
  <div class="fw-drawer-handle"></div>
  <div class="fw-drawer-head"><h2 class="fw-h2" data-i18n="mimica.words.title"></h2><button class="fw-icon-btn" id="drawerClose" data-i18n-aria-label="common.close">✕</button></div>
  <div class="fw-drawer-body"><div class="lista" id="lista"></div></div>
</div>

<div class="fw-flash" id="flash"></div>

<script src="./js/i18n/es.js"></script>
<script src="./js/funwait.js"></script>
<script>
const UMBRAL = 6, RETORNO = 3, DWELL = 350;
let config = Object.assign({ tiempo: 60, invertir: false }, FW.prefs.mimica || {});
function guardarCfg() { FW.prefs.mimica = { tiempo: config.tiempo, invertir: config.invertir }; FW.save(); }
let juego = { mazo: [], indice: 0, aciertos: 0, resultados: [], tiempoRestante: 0, timerId: null,
  activo: false, armado: true, baseGz: null, gz: null, neutroDesde: null, usandoTilt: false, pack: null };

const $ = id => document.getElementById(id);
const gameEl = $('game'), palabraEl = $('palabra'), timerEl = $('timer'), scoreEl = $('score'), fbEl = $('feedback'), temaChip = $('temaChip');

/* ---------- menú ---------- */
const packsEl = $('packs');
function pintarPaquetes(paquetes) {
  packsEl.replaceChildren(
    FW.tile('🎲', FW.t('common.random'), null, () => elegir(FW.shuffle(paquetes)[0])),
    ...paquetes.map(p => FW.tile(p.emoji, p.nombre, p.color, () => elegir(p)))
  );
}
async function cargarPaquetes() {
  $('packsEstado').hidden = false; $('packsMsg').textContent = FW.t('common.loading'); $('packsRetry').hidden = true;
  try {
    pintarPaquetes((await FW.loadContent('mimica')).paquetes);
    $('packsEstado').hidden = true;
  } catch (e) {
    $('packsMsg').textContent = FW.t('mimica.loadError');
    $('packsRetry').hidden = false;
  }
}
$('packsRetry').onclick = cargarPaquetes;

/* ---------- ajustes ---------- */
const tLabel = $('tLabel'), swInv = $('swInv');
function pintarCfg() { tLabel.textContent = FW.t('common.seconds', { n: config.tiempo }); swInv.classList.toggle('is-on', config.invertir); }
pintarCfg();
$('tMas').onclick = () => { config.tiempo = Math.min(120, config.tiempo + 15); pintarCfg(); guardarCfg(); };
$('tMenos').onclick = () => { config.tiempo = Math.max(30, config.tiempo - 15); pintarCfg(); guardarCfg(); };
swInv.onclick = () => { config.invertir = !config.invertir; pintarCfg(); guardarCfg(); };
$('opcionesBtn').onclick = () => FW.screen('opciones');
$('opcVolver').onclick = () => FW.screen('home');
$('opcHecho').onclick = () => FW.screen('home');

FW.bindSoundToggle($('swSonido'));

/* ---------- permiso de sensores (iOS) ---------- */
async function pedirPermiso() {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { juego.usandoTilt = (await DeviceMotionEvent.requestPermission()) === 'granted'; } catch (e) { juego.usandoTilt = false; }
  } else juego.usandoTilt = true;
}

/* ---------- flujo ---------- */
$('noRep').checked = FW.rulesSeen('mimica');
async function elegir(pack) {
  FW.unlock();
  juego.pack = pack;
  await pedirPermiso();
  if (FW.rulesSeen('mimica')) irCuenta(); else FW.screen('reglas');
}
$('reglasVolver').onclick = () => FW.screen('home');
$('empezar').onclick = () => { if ($('noRep').checked) FW.setRulesSeen('mimica', true); irCuenta(); };

function irCuenta() { FW.wakeLock(); FW.screen('countdown'); FW.countdown($('countNum'), empezarRonda); }

function empezarRonda() {
  const pack = juego.pack;
  temaChip.textContent = pack.nombre;
  juego.mazo = FW.shuffle(pack.palabras);
  juego.indice = 0; juego.aciertos = 0; juego.resultados = [];
  juego.tiempoRestante = config.tiempo; juego.activo = true; juego.armado = true;
  juego.baseGz = null; juego.gz = null; juego.neutroDesde = null;
  scoreEl.textContent = '✅ 0';
  pintarTimer(); mostrarPalabra(); correrTimer(); engancharSensores();
  FW.screen('game');
}

function pintarTimer() { timerEl.textContent = juego.tiempoRestante; timerEl.style.background = juego.tiempoRestante <= 5 ? 'var(--fw-pink)' : 'var(--fw-night)'; }
function correrTimer() {
  clearInterval(juego.timerId);
  juego.timerId = setInterval(() => {
    juego.tiempoRestante--; pintarTimer();
    if (juego.tiempoRestante <= 5 && juego.tiempoRestante > 0) FW.audio.tic();
    if (juego.tiempoRestante <= 0) finRonda();
  }, 1000);
}
function engancharSensores() { if (!juego.usandoTilt) return; window.removeEventListener('devicemotion', onMovimiento); window.addEventListener('devicemotion', onMovimiento); }
function mostrarPalabra() {
  if (juego.indice >= juego.mazo.length) { juego.mazo = FW.shuffle(juego.mazo); juego.indice = 0; }
  palabraEl.textContent = juego.mazo[juego.indice];
}

function registrar(ok) {
  if (!juego.activo) return;
  const palabra = juego.mazo[juego.indice];
  juego.resultados.push({ palabra, ok }); juego.indice++;
  if (ok) { juego.aciertos++; scoreEl.textContent = '✅ ' + juego.aciertos; flash('var(--fw-green)', FW.t('mimica.game.correct'), 'var(--fw-green-dark)'); FW.audio.acierto(); FW.haptic(60); }
  else { flash('var(--fw-pink)', FW.t('mimica.game.pass'), 'var(--fw-pink-dark)'); FW.audio.pasar(); FW.haptic([30, 40, 30]); }
  if (juego.tiempoRestante > 0) mostrarPalabra();
}
let flashT = null;
function flash(bg, texto, color) {
  gameEl.style.backgroundColor = bg; fbEl.textContent = texto; fbEl.style.color = color;
  fbEl.classList.remove('show'); void fbEl.offsetWidth; fbEl.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(() => { gameEl.style.backgroundColor = ''; }, 450);
}

/* ---------- detección por gravedad ---------- */
function onMovimiento(e) {
  if (!juego.activo) return;
  const g = e.accelerationIncludingGravity; if (!g || g.z == null) return;
  juego.gz = juego.gz === null ? g.z : juego.gz * 0.8 + g.z * 0.2;
  const val = juego.gz;
  if (juego.baseGz === null) { juego.baseGz = val; return; }
  const delta = val - juego.baseGz;
  if (juego.armado) {
    if (delta > UMBRAL) { juego.armado = false; juego.neutroDesde = null; accion(true); }
    else if (delta < -UMBRAL) { juego.armado = false; juego.neutroDesde = null; accion(false); }
  } else {
    if (Math.abs(delta) < RETORNO) {
      if (juego.neutroDesde === null) juego.neutroDesde = performance.now();
      else if (performance.now() - juego.neutroDesde >= DWELL) { juego.armado = true; juego.baseGz = val; juego.neutroDesde = null; }
    } else juego.neutroDesde = null;
  }
}
function accion(positivo) { registrar(config.invertir ? positivo : !positivo); }

/* ---------- toque de respaldo ---------- */
gameEl.addEventListener('click', (e) => {
  if (!juego.activo || e.target.closest('#pausaBtn')) return;
  const abajo = e.clientY > window.innerHeight / 2;
  registrar(config.invertir ? !abajo : abajo);
});

/* ---------- pausa ---------- */
$('pausaBtn').onclick = (e) => {
  e.stopPropagation();
  if (!juego.activo) return;
  juego.activo = false; clearInterval(juego.timerId); window.removeEventListener('devicemotion', onMovimiento);
  FW.screen('pause');
};
$('seguir').onclick = () => {
  FW.screen('countdown');
  FW.countdown($('countNum'), () => {
    juego.activo = true; juego.armado = true; juego.baseGz = null; juego.gz = null; juego.neutroDesde = null;
    FW.screen('game'); correrTimer(); engancharSensores();
  });
};
$('salir').onclick = () => { juego.activo = false; clearInterval(juego.timerId); window.removeEventListener('devicemotion', onMovimiento); FW.releaseWake(); FW.screen('home'); };

/* ---------- fin ---------- */
function finRonda() {
  juego.activo = false; clearInterval(juego.timerId); window.removeEventListener('devicemotion', onMovimiento);
  FW.audio.fin(); FW.releaseWake(); mostrarResultados();
}
function mostrarResultados() {
  $('rScore').textContent = juego.aciertos;
  $('rAciertos').textContent = FW.tn('mimica.result.hits', juego.aciertos);
  $('rTitulo').textContent = juego.aciertos >= 15 ? FW.t('mimica.result.great') : juego.aciertos >= 8 ? FW.t('mimica.result.good') : FW.t('mimica.result.end');
  const lista = $('lista'); lista.replaceChildren();
  const item = txt => { const d = document.createElement('div'); d.className = 'item'; d.textContent = txt; lista.appendChild(d); };
  if (!juego.resultados.length) item(FW.t('mimica.result.none'));
  juego.resultados.forEach(r => item((r.ok ? '✅ ' : '⏭️ ') + r.palabra));
  $('verPalabras').textContent = FW.t('mimica.result.words', { n: juego.resultados.length });
  cerrarDrawer();
  FW.screen('result');
}

/* ---------- cajón de palabras ---------- */
function abrirDrawer() { $('drawer').classList.add('is-open'); $('drawerBg').classList.add('is-open'); }
function cerrarDrawer() { $('drawer').classList.remove('is-open'); $('drawerBg').classList.remove('is-open'); }
$('verPalabras').onclick = abrirDrawer;
$('drawerClose').onclick = cerrarDrawer;
$('drawerBg').onclick = cerrarDrawer;

$('otra').onclick = async () => { cerrarDrawer(); await pedirPermiso(); irCuenta(); };

FW.screen('home');
cargarPaquetes();
</script>
</body>
</html>
